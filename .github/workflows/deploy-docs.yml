name: Deploy docs

# Branch-per-environment (VC-style SSH deploys, one DEPLOY_SSH_KEY secret):
#
#   staging  ->  staging  (docs.valyd.vip)
#   main     ->  prod     (docs.valyd.id)   [default branch = production]
#
# The DEV box is the working machine (you edit + build there directly), so it is
# NOT auto-deployed — a CI `git reset --hard` would wipe in-progress work. Push
# `development` freely; only `staging`/`main` trigger a deploy.
#
# Only ONE repo secret is needed: DEPLOY_SSH_KEY (the private key; its public key
# is in each box's authorized_keys). Hosts/paths live in the jobs below.
# deploy/deploy.sh derives idp/dev hosts from DOCS_HOST's TLD.
on:
  push:
    branches: [staging, main]
  workflow_dispatch:

concurrency:
  group: deploy-docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # -------------------------------------------------------------- staging
  deploy-staging:
    name: Deploy staging (docs.valyd.vip)
    # Enable once the .vip box host is filled below AND provisioned:
    # repo → Settings → Secrets and variables → Actions → Variables → STAGING_ENABLED=true
    if: github.ref == 'refs/heads/staging' && vars.STAGING_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://docs.valyd.vip
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 149.28.236.135          # staging box (idp.pollus.online), *.valyd.vip
          username: ahmad
          port: 2222
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          command_timeout: 20m
          envs: DOCS_BRANCH,DOCS_PATH,PM2_APP,DOCS_HOST
          script: |
            set -euo pipefail
            export DOCS_BRANCH=staging
            export DOCS_PATH=/var/www/docs-nextra
            export PM2_APP=docs-nextra
            export DOCS_HOST=https://docs.valyd.vip
            cd "$DOCS_PATH"
            git fetch --prune origin "$DOCS_BRANCH"
            tmp="$(mktemp)"; git show "origin/$DOCS_BRANCH:deploy/deploy.sh" > "$tmp"
            bash "$tmp"; rm -f "$tmp"

  # -------------------------------------------------------------- production
  deploy-prod:
    name: Deploy production (docs.valyd.id)
    # Enable once the .id box host is filled below AND provisioned:
    # repo → Settings → Secrets and variables → Actions → Variables → PROD_ENABLED=true
    if: github.ref == 'refs/heads/main' && vars.PROD_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://docs.valyd.id
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          # TODO: set the prod (.id) box. The prod IdP box is 172.22.29.105 (rahmad),
          # estate-internal — reach it via the bastion (proxy_host 96.250.208.62 / javy).
          host: PROD_HOST               # <-- fill: prod box IP/host
          username: PROD_USER           # <-- fill: prod box user
          port: 22
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # proxy_host: 96.250.208.62   # <-- uncomment if the prod box is estate-internal
          # proxy_username: javi
          # proxy_port: 22
          # proxy_key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          command_timeout: 20m
          envs: DOCS_BRANCH,DOCS_PATH,PM2_APP,DOCS_HOST
          script: |
            set -euo pipefail
            export DOCS_BRANCH=main
            export DOCS_PATH=/var/www/pollus_main_servers/docs-nextra   # <-- adjust if different on box
            export PM2_APP=docs-nextra
            export DOCS_HOST=https://docs.valyd.id
            cd "$DOCS_PATH"
            git fetch --prune origin "$DOCS_BRANCH"
            tmp="$(mktemp)"; git show "origin/$DOCS_BRANCH:deploy/deploy.sh" > "$tmp"
            bash "$tmp"; rm -f "$tmp"
