name: Deploy docs

# Branch → environment → host mapping:
#   development → dev        (*.valyd.work)
#   staging     → staging    (*.valyd.vip)
#   main        → production (*.valyd.id)
#
# Each GitHub Environment (dev / staging / production) supplies its own secrets
# and variables, so this one workflow deploys all three without hardcoding hosts.
#
# Required per-Environment SECRETS:
#   SSH_HOST, SSH_USER, SSH_KEY   — how CI reaches the box (SSH private key)
#   SSH_PORT                      — optional (default 22; staging uses 2222)
# Required per-Environment VARIABLES:
#   DOCS_PATH                     — checkout path on the box
#   PM2_APP                       — pm2 app name (e.g. docs-nextra)
#   NEXT_PUBLIC_DOCS_URL          — this env's docs host
#   NEXT_PUBLIC_IDP_URL           — this env's API host
#   NEXT_PUBLIC_DEV_URL           — this env's portal host

on:
  push:
    branches: [development, staging, main]
  workflow_dispatch: {}   # allow manual re-deploy from the Actions tab

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Map the pushed branch to the matching GitHub Environment so its secrets resolve.
    environment: >-
      ${{ github.ref_name == 'main' && 'production'
        || github.ref_name == 'staging' && 'staging'
        || 'dev' }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 20m
          script_stop: true
          envs: DOCS_BRANCH,DOCS_PATH,PM2_APP,NEXT_PUBLIC_DOCS_URL,NEXT_PUBLIC_IDP_URL,NEXT_PUBLIC_DEV_URL
          script: |
            export DOCS_BRANCH="${{ github.ref_name }}"
            export DOCS_PATH="${{ vars.DOCS_PATH }}"
            export PM2_APP="${{ vars.PM2_APP }}"
            export NEXT_PUBLIC_DOCS_URL="${{ vars.NEXT_PUBLIC_DOCS_URL }}"
            export NEXT_PUBLIC_IDP_URL="${{ vars.NEXT_PUBLIC_IDP_URL }}"
            export NEXT_PUBLIC_DEV_URL="${{ vars.NEXT_PUBLIC_DEV_URL }}"
            cd "$DOCS_PATH"
            bash deploy/deploy.sh
