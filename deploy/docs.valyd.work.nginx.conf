# docs.valyd.work — Nextra docs site (Next.js server on 127.0.0.1:4100, pm2 app "docs-nextra").
# Option A cutover: nextra takes over the canonical docs.valyd.work host (retiring the old
# Vite SPA that used to serve it). The Let's Encrypt cert for docs.valyd.work ALREADY exists
# (/etc/letsencrypt/live/docs.valyd.work/), so no certbot run is needed — this reuses it.
server {
    server_name docs.valyd.work;

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/docs.valyd.work/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/docs.valyd.work/privkey.pem;

    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Long cache for hashed build assets
    location /_next/static/ {
        proxy_pass http://127.0.0.1:4100;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}

# HTTP → HTTPS redirect (keep the ACME path open for renewals).
server {
    listen 80;
    listen [::]:80;
    server_name docs.valyd.work;

    location ^~ /.well-known/acme-challenge/ { allow all; }
    location / { return 301 https://$host$request_uri; }
}
