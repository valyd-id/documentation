# docs-nextra.valyd.work — Nextra docs site (Next.js server on 127.0.0.1:4100, pm2 app "docs-nextra")
# Certbot adds the 443/ssl blocks when go-live.sh runs.
server {
    server_name docs-nextra.valyd.work;
    listen 80;
    listen [::]:80;

    client_max_body_size 20M;

    location ^~ /.well-known/acme-challenge/ { allow all; }

    location / {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Long cache for hashed build assets
    location /_next/static/ {
        proxy_pass http://127.0.0.1:4100;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
